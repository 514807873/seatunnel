seatunnel:
  engine:
    classloader-cache-mode: true
    history-job-expire-minutes: 1440
    backup-count: 1
    queue-type: blockingqueue
    print-execution-info-interval: 60
    print-job-metrics-info-interval: 60
    slot-service:
      dynamic-slot: true
    checkpoint:
      interval: 10000
      timeout: 60000
      storage:
        type: localfile
        max-retained: 3
        plugin-config:
          namespace: C:\ProgramData\seatunnel\checkpoint\
    telemetry:
      metric:
        enabled: false
      logs:
        scheduled-deletion-enable: true
    http:
      enable-http: true
      port: 8080
      enable-dynamic-port: false
      # K8s NodePort / Ingress: rewrite WebUI log links through this public URL (leave empty for bare-metal)
      # public-url: http://192.168.10.197:30890
      # Uncomment the following lines to enable basic authentication for web UI
      # enable-basic-auth: true
      # basic-auth-username: admin
      # basic-auth-password: admin
    event-report-http:
      url: "http://192.168.10.197:30863/st/zeta/callBack"
      headers:
        Content-Type: application/json
    # Direct write to Pangu MySQL / ClickHouse. Empty url disables that store.
    # Need mysql-connector and clickhouse-jdbc on the engine classpath (lib/).
    pangu-store:
      url: "jdbc:mysql://192.168.10.197:30316/pangu?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8"
      username: root
      password: Admin#13579Mysql197
      clickhouse-url: "jdbc:ch://192.168.10.197:30823/default?compress=true"
      clickhouse-username: default
      clickhouse-password: Admin#13579ClickHouse197
